name: regenerate portrait

on:
  workflow_dispatch:       # manually triggered from Actions tab
  push:
    paths:
      - "photo.jpg"        # also auto-runs when you push a new photo

permissions:
  contents: write

jobs:
  portrait:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache the rembg ONNX model (~176 MB) between runs
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v1

      - name: Install dependencies
        run: |
          pip install --quiet \
            pillow \
            numpy \
            opencv-python-headless \
            rembg \
            onnxruntime

      - name: Generate ascii.svg
        run: python3 scripts/generate_portrait.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- ascii.svg)" ]; then
            echo "ascii.svg unchanged — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii.svg
          git commit -m "portrait: regenerate from photo"
          git push
