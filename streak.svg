<svg xmlns="http://www.w3.org/2000/svg" width="620" height="72" viewBox="0 0 620 72">
  <defs>
    <style>
      
      .big   { font-family: monospace; font-size: 26px; font-weight: 700; fill: #24292f; }
      .label { font-family: monospace; font-size: 11px; fill: #57606a; }
      .range { font-family: monospace; font-size: 10px; fill: #57606a; }
    </style>
  </defs>
  <!-- current streak -->
  <text class="big"  x="14"      y="34">2</text>
  <text class="label" x="14"     y="50">current streak</text>

  <!-- longest streak -->
  <text class="big"  x="310"      y="34">13</text>
  <text class="label" x="310"     y="50">longest streak</text>
  <text class="range" x="310"     y="64">23 Mar 2026 – 4 Apr 2026</text>

  <line x1="290" y1="8" x2="290" y2="64"
        stroke="#d0d7de" stroke-width="0.5"/>
</svg>
